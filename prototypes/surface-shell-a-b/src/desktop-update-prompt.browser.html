<!doctype html>
<html lang="de">
  <head><meta charset="utf-8"><title>Desktop Update Prompt</title></head>
  <body>
    <div id="root"></div>
    <script>
      const callbacks = new Map();
      let nextCallback = 1;
      window.isTauri = true;
      window.__TAURI_INTERNALS__ = {
        transformCallback(callback) {
          const id = nextCallback++;
          callbacks.set(id, callback);
          return id;
        },
        unregisterCallback(id) { callbacks.delete(id); },
        async invoke(command, args) {
          if (command === "plugin:app|version") return "0.1.45";
          if (command === "desktop_update_overview") {
            return { currentVersion: "0.1.45", availableVersion: null, phase: "idle" };
          }
          if (command === "plugin:event|listen") {
            window.emitUpdate = (overview) => callbacks.get(args.handler)?.({ payload: overview });
            return 1;
          }
          if (command === "request_desktop_update_check") {
            window.updateCheckRequests = (window.updateCheckRequests ?? 0) + 1;
            return;
          }
          if (command === "plugin:event|unlisten") return;
          throw new Error(`Unexpected command: ${command}`);
        },
      };
    </script>
    <script type="module" src="/src/desktop-update-prompt.browser.tsx"></script>
  </body>
</html>
