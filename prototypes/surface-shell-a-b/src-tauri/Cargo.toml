[package]
name = "tafelraum"
version = "0.1.92"
description = "Lokale Unterrichts- und Präsentationsumgebung"
authors = ["JUJIES"]
license-file = "../../../LICENSE"
edition = "2021"

[lib]
name = "tafelraum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2"

[dependencies]
# WKWebView media fullscreen; keep app.macOSPrivateApi enabled in tauri.conf.json.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# Public WKFrameInfo/evaluateJavaScript API for the bounded Room fullscreen relay.
# These framework bindings are already used transitively by Wry.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSObject", "NSString", "NSURL", "NSURLRequest"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKContentWorld", "WKFrameInfo", "WKScriptMessage", "WKScriptMessageHandler", "WKUserContentController", "WKWebView", "WKWebViewConfiguration"] }
