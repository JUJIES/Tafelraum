name: Windows Public 0.1.96 live updater acceptance

on:
  push:
    branches: [codex/public-0.1.96-live-updater]

permissions:
  actions: read
  contents: read

jobs:
  native-acceptance:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Test install, startup and archive retention on a disposable Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '9a93ae7925b44c57d981b71935d93121b95229d2'
          $candidateRun = 43292737987
          $directory = Join-Path $env:RUNNER_TEMP 'tafelraum-parity-qa'
          New-Item -ItemType Directory $directory | Out-Null
          for ($attempt = 0; $attempt -lt 140; $attempt++) {
            $run = gh run view $candidateRun --repo $env:GITHUB_REPOSITORY --json status,conclusion,headSha | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.headSha -ne $sourceCommit) { throw 'Candidate run mismatch' }
            if ($run.status -eq 'completed') { break }
            Start-Sleep -Seconds 10
          }
          if ($run.conclusion -ne 'success') { throw 'Candidate build is not successful' }
          gh run download $candidateRun --repo $env:GITHUB_REPOSITORY --name "tafelraum-public-windows-$sourceCommit" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $receipt = Get-Content (Join-Path $directory 'windows-build.json') | ConvertFrom-Json
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          $candidate = $installers[0]
          if ($receipt.sourceCommit -ne $sourceCommit -or $receipt.version -ne '0.1.96' -or
              (Get-FileHash $candidate.FullName).Hash -ne $receipt.installerSha256) { throw 'Candidate identity mismatch' }

          $previous = Join-Path $directory 'previous.exe'
          Invoke-WebRequest 'https://github.com/JUJIES/Tafelraum/releases/download/v0.1.95/Tafelraum-Public-0.1.95-Windows-x64-setup.exe' -UseBasicParsing -OutFile $previous
          if ((Get-FileHash $previous).Hash -ne '4817bf28d7e4f4040c0e1bfae8665f5d51b6214e950a5ce3e5787148cdfaca7c') { throw 'Prior official installer hash mismatch' }
          $profile = Join-Path $env:APPDATA 'app.jujies.tafelraum.public'
          $application = Join-Path $env:LOCALAPPDATA 'Tafelraum Public\tafelraum.exe'
          if ((Test-Path $profile) -or (Test-Path $application)) { throw 'Runner already has a Public profile or installation' }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          function Find-NativeElement($window, [string]$name) {
            $condition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::NameProperty, $name)
            return $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          function Install-App([string]$installer) {
            $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
            if (!$install.WaitForExit(180000) -or $install.ExitCode -ne 0) { throw 'Installer did not complete successfully' }
          }
          function Start-App([string]$version, $running = $null) {
            if ((Get-Item $application).VersionInfo.ProductVersion -ne $version) { throw 'Installed version mismatch' }
            $app = $running
            if (!$app) { $app = Start-Process -FilePath $application -PassThru }
            $lastProbe = ''
            $openedStarter = $false
            $archiveAvailable = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) { throw 'Native app exited during startup' }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:49318/api/archive/status' -TimeoutSec 2
                $archiveAvailable = [bool]$status.available
                if ($archiveAvailable -and $app.MainWindowHandle -ne 0) {
                  $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
                  $lastProbe = $window.Current.Name
                  $toolbar = Find-NativeElement $window ('Pr' + [char]0xe4 + 'sentieren')
                  if (!$toolbar) { $toolbar = Find-NativeElement $window 'Present' }
                  if ($toolbar) {
                    Write-Host "Tafelraum $version native toolbar and archive are ready"
                    return $app
                  }
                  if (!$openedStarter) {
                    $starter = Find-NativeElement $window 'Erster Unterricht'
                    if ($starter) {
                      $invoker = $starter.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                      $invoker.Invoke()
                      $openedStarter = $true
                    }
                  }
                }
              } catch { $lastProbe = $_.Exception.Message }
              Start-Sleep -Seconds 1
            }
            throw "Tafelraum $version not ready: archive=$archiveAvailable hwnd=$($app.MainWindowHandle) nativeUI=$lastProbe"
          }
          function Close-App($app) {
            $app.Refresh()
            if (!$app.CloseMainWindow()) { throw 'Could not send the native window close request' }
            if (!$app.WaitForExit(30000)) { throw 'Native app did not close after the window close request' }
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $null = Invoke-RestMethod 'http://127.0.0.1:49318/api/archive/status' -TimeoutSec 1 }
              catch { return }
              Start-Sleep -Seconds 1
            }
            throw 'Loopback service remained after app exit'
          }

          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          public static class TafelraumTestPointer {
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags, uint dx, uint dy, uint data, UIntPtr extra);
          }
          '@
          function Click-NativeElement($element) {
            $bounds = $element.Current.BoundingRectangle
            if ($bounds.IsEmpty -or $bounds.Width -le 0 -or $bounds.Height -le 0) {
              throw "No screen bounds for native element: $($element.Current.Name)"
            }
            [void][TafelraumTestPointer]::SetCursorPos(
              [int]($bounds.X + $bounds.Width / 2), [int]($bounds.Y + $bounds.Height / 2))
            [TafelraumTestPointer]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero)
            [TafelraumTestPointer]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
          }

          function Invoke-NativeElement($element) {
            Write-Host "Invoking $($element.Current.Name), enabled=$($element.Current.IsEnabled)"
            $action = $null
            try {
              if ($element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern, [ref]$action)) {
                $action.Invoke()
                return
              }
              if ($element.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern, [ref]$action)) {
                $action.Expand()
                return
              }
            } catch { Write-Host "Using the visible control after UI Automation reported: $($_.Exception.Message)" }
            Click-NativeElement $element
          }

          Install-App $previous
          $oldApp = Start-App '0.1.95'
          $catalog = Join-Path $profile 'unterrichtsarchiv\archive.json'
          $before = (Get-FileHash $catalog).Hash
          $manifest = $null
          for ($attempt = 0; $attempt -lt 150; $attempt++) {
            try {
              $manifest = Invoke-RestMethod 'https://github.com/JUJIES/Tafelraum/releases/latest/download/latest.json' -TimeoutSec 10
              if ($manifest.version -eq '0.1.96') { break }
            } catch {}
            Start-Sleep -Seconds 10
          }
          if ($manifest.version -ne '0.1.96' -or $manifest.sourceCommit -ne $sourceCommit) { throw 'Public feed is not ready' }

          # The previous app checks automatically at startup. Let that request settle.
          Start-Sleep -Seconds 8
          $oldApp.Refresh()
          $window = [System.Windows.Automation.AutomationElement]::FromHandle($oldApp.MainWindowHandle)
          $nativeMenu = Find-NativeElement $window 'Tafelraum'
          $check = $null
          if ($nativeMenu) {
            try {
              Invoke-NativeElement $nativeMenu
              $check = Find-NativeElement $window ([regex]::Unescape('Nach Updates suchen \u2026'))
              if (!$check) { $check = Find-NativeElement $window ([regex]::Unescape('Check for updates \u2026')) }
              if (!$check) { $check = Find-NativeElement $window ([regex]::Unescape('Update 0.1.96 verf\u00fcgbar \u2026')) }
              if (!$check) { $check = Find-NativeElement $window ([regex]::Unescape('Update 0.1.96 available \u2026')) }
            } catch { Write-Host $_.Exception.Message }
          }
          if (!$check) {
            $settings = Find-NativeElement $window 'Einstellungen'
            if (!$settings) { $settings = Find-NativeElement $window 'Settings' }
            if (!$settings) { throw 'Could not locate the update menu or Settings' }
            Invoke-NativeElement $settings
            Start-Sleep -Milliseconds 500
            $versionMenu = Find-NativeElement $window 'Version und Updates'
            if (!$versionMenu) { $versionMenu = Find-NativeElement $window 'Version and updates' }
            if ($versionMenu) { Invoke-NativeElement $versionMenu }
            Start-Sleep -Milliseconds 500
            foreach ($label in @('Nach Updates suchen','Check for updates',([regex]::Unescape('Jetzt aktualisieren \u2026')),([regex]::Unescape('Update now \u2026')))) {
              $check = Find-NativeElement $window $label
              if ($check) { break }
            }
          }
          if (!$check) { throw 'Update action missing' }
          Invoke-NativeElement $check
          $install = $null
          $desktop = [System.Windows.Automation.AutomationElement]::RootElement
          for ($attempt = 0; $attempt -lt 45; $attempt++) {
            $install = Find-NativeElement $desktop 'Installieren (empfohlen)'
            if (!$install) { $install = Find-NativeElement $desktop 'Install (recommended)' }
            if ($install) { break }
            Start-Sleep -Seconds 1
          }
          if (!$install) { throw 'Updater confirmation dialog did not appear' }
          Click-NativeElement $install
          Write-Host "Confirmed Windows update dialog"
          if (!$oldApp.WaitForExit(300000)) { throw 'Old process did not hand off to the updater' }
          $restarted = $null
          for ($attempt = 0; $attempt -lt 150; $attempt++) {
            $restarted = Get-Process tafelraum -ErrorAction SilentlyContinue |
              Where-Object { $_.Id -ne $oldApp.Id -and $_.Path -eq $application } | Select-Object -First 1
            if ($restarted -and (Get-Item $application).VersionInfo.ProductVersion -eq '0.1.96') { break }
            Start-Sleep -Seconds 2
          }
          if (!$restarted) { throw 'Updated native app did not restart automatically' }
          $newApp = Start-App '0.1.96' $restarted
          $room = Invoke-WebRequest 'http://127.0.0.1:49318/room.html' -UseBasicParsing -TimeoutSec 5
          if ($room.StatusCode -ne 200 -or $room.Content -notmatch 'Room Canvas') { throw 'Packaged Room page missing' }
          Close-App $newApp
          if ((Get-FileHash $catalog).Hash -ne $before) { throw 'The archive catalog changed during install or startup' }
          $releasePath = Get-ChildItem (Split-Path $application) -Recurse -Filter 'desktop-release.json' |
            Where-Object { $_.Directory.Name -eq 'server' } | Select-Object -First 1
          $release = Get-Content $releasePath.FullName | ConvertFrom-Json
          if ($release.sourceCommit -ne $sourceCommit) { throw 'Native bundle source mismatch' }
          [ordered]@{version='0.1.96'; sourceCommit=$sourceCommit; priorVersion='0.1.95'; installerSha256=$receipt.installerSha256;
            nativeStartup=$true; regularExit=$true; catalogRetained=$true; roomPage=$true; upgrade='official GitHub updater'; automaticRestart=$true} |
            ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $directory 'native-acceptance.json')
      - name: Upload live updater acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-windows-live-updater
          path: ${{ runner.temp }}/tafelraum-parity-qa/native-acceptance.json
          if-no-files-found: error
