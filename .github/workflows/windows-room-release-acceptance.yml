name: Windows Room release acceptance

on:
  push:
    branches: [codex/room-video-windows-acceptance]

permissions:
  actions: read
  contents: read

jobs:
  native-acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Set up Node 24 for the WebView readiness probe
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.x'
      - name: Test install, startup and archive retention on a disposable Windows runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '8059dfde7a37fe9a777654a0ec21016a55bbf124'
          $candidateRun = 42604687694
          $directory = Join-Path $env:RUNNER_TEMP 'tafelraum-room-qa'
          New-Item -ItemType Directory $directory | Out-Null
          for ($attempt = 0; $attempt -lt 80; $attempt++) {
            $run = gh run view $candidateRun --repo $env:GITHUB_REPOSITORY --json status,conclusion,headSha | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.headSha -ne $sourceCommit) { throw 'Candidate run mismatch' }
            if ($run.status -eq 'completed') { break }
            Start-Sleep -Seconds 10
          }
          if ($run.conclusion -ne 'success') { throw 'Candidate build is not successful' }
          gh run download $candidateRun --repo $env:GITHUB_REPOSITORY --name "tafelraum-public-windows-$sourceCommit" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $receipt = Get-Content (Join-Path $directory 'windows-build.json') | ConvertFrom-Json
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          $candidate = $installers[0]
          if ($receipt.sourceCommit -ne $sourceCommit -or $receipt.version -ne '0.1.93' -or
              (Get-FileHash $candidate.FullName).Hash -ne $receipt.installerSha256) { throw 'Candidate identity mismatch' }

          $previous = Join-Path $directory 'previous.exe'
          Invoke-WebRequest 'https://github.com/JUJIES/Tafelraum/releases/download/v0.1.92/Tafelraum-Public-0.1.92-Windows-x64-setup.exe' -OutFile $previous
          if ((Get-FileHash $previous).Hash -ne '2e7939a89660af394d3c4f2f72784708d3614b3518989bf18be472f6bbb66def') { throw 'Prior official installer hash mismatch' }
          $profile = Join-Path $env:APPDATA 'app.jujies.tafelraum.public'
          $application = Join-Path $env:LOCALAPPDATA 'Tafelraum Public\tafelraum.exe'
          if ((Test-Path $profile) -or (Test-Path $application)) { throw 'Runner already has a Public profile or installation' }
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = '--remote-debugging-port=49193'
          $probe = Join-Path $directory 'view-ready.mjs'
          @'
          const views=await fetch('http://127.0.0.1:49193/json/list').then(response=>response.json());
          const view=views.find(view=>view.url?.startsWith('http://127.0.0.1:49318/'));
          if(!view){console.log('No app WebView',views.map(view=>view.url));process.exit(1);}
          const ws=new WebSocket(view.webSocketDebuggerUrl);
          const openStarter=`(() => {
            if (document.querySelector('.excalidraw canvas')) return 'canvas';
            const starter = [...document.querySelectorAll('button')].find(button =>
              ['Erster Unterricht','First lesson'].includes(button.textContent.trim()));
            starter?.click();
            return starter ? 'opening' : 'waiting';
          })()`;
          const value=await new Promise((resolve,reject)=>{
            const timeout=setTimeout(()=>reject(Error('No WebView response')),1500);
            ws.addEventListener('open',()=>ws.send(JSON.stringify({id:1,method:'Runtime.evaluate',
              params:{expression:openStarter,returnByValue:true}})));
            ws.addEventListener('message',({data})=>{
              const message=JSON.parse(data);
              if(message.id===1){clearTimeout(timeout);resolve(message.result?.result?.value);}
            });
            ws.addEventListener('error',()=>reject(Error('WebView probe failed')));
          });
          ws.close();
          console.log(value);
          process.exitCode=value==='canvas'?0:1;
          '@ | Set-Content -Encoding utf8 $probe

          function Install-App([string]$installer) {
            $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
            if (!$install.WaitForExit(180000) -or $install.ExitCode -ne 0) { throw 'Installer did not complete successfully' }
          }
          function Start-App([string]$version) {
            if ((Get-Item $application).VersionInfo.ProductVersion -ne $version) { throw 'Installed version mismatch' }
            $app = Start-Process -FilePath $application -PassThru
            $lastProbe = ''
            $archiveAvailable = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) { throw 'Native app exited during startup' }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:49318/api/archive/status' -TimeoutSec 2
                $archiveAvailable = [bool]$status.available
                if ($archiveAvailable -and $app.MainWindowHandle -ne 0) {
                  $lastProbe = (& node $probe 2>&1 | Out-String)
                  if ($LASTEXITCODE -eq 0) {
                    Write-Host "Tafelraum $version WebView and archive are ready"
                    return $app
                  }
                }
              } catch { }
              Start-Sleep -Seconds 1
            }
            throw "Tafelraum $version not ready: archive=$archiveAvailable hwnd=$($app.MainWindowHandle) WebView=$lastProbe"
          }
          function Close-App($app) {
            $app.Refresh()
            if (!$app.CloseMainWindow()) { throw 'Could not send the native window close request' }
            if (!$app.WaitForExit(30000)) { throw 'Native app did not close after the window close request' }
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $null = Invoke-RestMethod 'http://127.0.0.1:49318/api/archive/status' -TimeoutSec 1 }
              catch { return }
              Start-Sleep -Seconds 1
            }
            throw 'Loopback service remained after app exit'
          }

          Install-App $previous
          $oldApp = Start-App '0.1.92'
          Close-App $oldApp
          $catalog = Join-Path $profile 'unterrichtsarchiv\archive.json'
          $before = (Get-FileHash $catalog).Hash
          Install-App $candidate.FullName
          $newApp = Start-App '0.1.93'
          $room = Invoke-WebRequest 'http://127.0.0.1:49318/room.html' -TimeoutSec 5
          if ($room.StatusCode -ne 200 -or $room.Content -notmatch 'Room Canvas') { throw 'Packaged Room page missing' }
          Close-App $newApp
          if ((Get-FileHash $catalog).Hash -ne $before) { throw 'The archive catalog changed during install or startup' }
          $releasePath = Get-ChildItem (Split-Path $application) -Recurse -Filter 'desktop-release.json' |
            Where-Object { $_.Directory.Name -eq 'server' } | Select-Object -First 1
          $release = Get-Content $releasePath.FullName | ConvertFrom-Json
          if ($release.sourceCommit -ne $sourceCommit) { throw 'Native bundle source mismatch' }
          [ordered]@{version='0.1.93'; sourceCommit=$sourceCommit; priorVersion='0.1.92'; installerSha256=$receipt.installerSha256;
            nativeStartup=$true; regularExit=$true; catalogRetained=$true; roomPage=$true; upgrade='NSIS installer'} |
            ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $directory 'native-acceptance.json')
      - name: Upload native acceptance receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-windows-native-acceptance
          path: ${{ runner.temp }}/tafelraum-room-qa/native-acceptance.json
          if-no-files-found: error
