name: Windows A4 print acceptance

on:
  push:
    branches: [codex/a4-print-windows-acceptance]

permissions:
  actions: read
  contents: read

jobs:
  native-acceptance:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Test install, startup and archive retention on a disposable Windows runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceCommit = '9f0e6e22ee8c12a58bce95e238a3e99753d9076f'
          $candidateRun = 42624016760
          $directory = Join-Path $env:RUNNER_TEMP 'tafelraum-print-qa'
          New-Item -ItemType Directory $directory | Out-Null
          for ($attempt = 0; $attempt -lt 80; $attempt++) {
            $run = gh run view $candidateRun --repo $env:GITHUB_REPOSITORY --json status,conclusion,headSha | ConvertFrom-Json
            if ($LASTEXITCODE -ne 0 -or $run.headSha -ne $sourceCommit) { throw 'Candidate run mismatch' }
            if ($run.status -eq 'completed') { break }
            Start-Sleep -Seconds 10
          }
          if ($run.conclusion -ne 'success') { throw 'Candidate build is not successful' }
          gh run download $candidateRun --repo $env:GITHUB_REPOSITORY --name "tafelraum-public-windows-$sourceCommit" --dir $directory
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          $receipt = Get-Content (Join-Path $directory 'windows-build.json') | ConvertFrom-Json
          $installers = @(Get-ChildItem $directory -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one candidate installer' }
          $candidate = $installers[0]
          if ($receipt.sourceCommit -ne $sourceCommit -or $receipt.version -ne '0.1.94' -or
              (Get-FileHash $candidate.FullName).Hash -ne $receipt.installerSha256) { throw 'Candidate identity mismatch' }

          $previous = Join-Path $directory 'previous.exe'
          Invoke-WebRequest 'https://github.com/JUJIES/Tafelraum/releases/download/v0.1.93/Tafelraum-Public-0.1.93-Windows-x64-setup.exe' -UseBasicParsing -OutFile $previous
          if ((Get-FileHash $previous).Hash -ne '9269b5dffd849e3a6e0ac091fd32f5c33a2188fa1a56e850d4c2683442cb2b7d') { throw 'Prior official installer hash mismatch' }
          $profile = Join-Path $env:APPDATA 'app.jujies.tafelraum.public'
          $application = Join-Path $env:LOCALAPPDATA 'Tafelraum Public\tafelraum.exe'
          if ((Test-Path $profile) -or (Test-Path $application)) { throw 'Runner already has a Public profile or installation' }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          function Find-NativeElement($window, [string]$name) {
            $condition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::NameProperty, $name)
            return $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          function Install-App([string]$installer) {
            $install = Start-Process -FilePath $installer -ArgumentList '/S' -PassThru
            if (!$install.WaitForExit(180000) -or $install.ExitCode -ne 0) { throw 'Installer did not complete successfully' }
          }
          function Start-App([string]$version) {
            if ((Get-Item $application).VersionInfo.ProductVersion -ne $version) { throw 'Installed version mismatch' }
            $app = Start-Process -FilePath $application -PassThru
            $lastProbe = ''
            $openedStarter = $false
            $archiveAvailable = $false
            for ($attempt = 0; $attempt -lt 40; $attempt++) {
              $app.Refresh()
              if ($app.HasExited) { throw 'Native app exited during startup' }
              try {
                $status = Invoke-RestMethod 'http://127.0.0.1:49318/api/archive/status' -TimeoutSec 2
                $archiveAvailable = [bool]$status.available
                if ($archiveAvailable -and $app.MainWindowHandle -ne 0) {
                  $window = [System.Windows.Automation.AutomationElement]::FromHandle($app.MainWindowHandle)
                  $lastProbe = $window.Current.Name
                  $toolbar = Find-NativeElement $window ('Pr' + [char]0xe4 + 'sentieren')
                  if (!$toolbar) { $toolbar = Find-NativeElement $window 'Present' }
                  if ($toolbar) {
                    Write-Host "Tafelraum $version native toolbar and archive are ready"
                    return $app
                  }
                  if (!$openedStarter) {
                    $starter = Find-NativeElement $window 'Erster Unterricht'
                    if ($starter) {
                      $invoker = $starter.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                      $invoker.Invoke()
                      $openedStarter = $true
                    }
                  }
                }
              } catch { $lastProbe = $_.Exception.Message }
              Start-Sleep -Seconds 1
            }
            throw "Tafelraum $version not ready: archive=$archiveAvailable hwnd=$($app.MainWindowHandle) nativeUI=$lastProbe"
          }
          function Close-App($app) {
            $app.Refresh()
            if (!$app.CloseMainWindow()) { throw 'Could not send the native window close request' }
            if (!$app.WaitForExit(30000)) { throw 'Native app did not close after the window close request' }
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try { $null = Invoke-RestMethod 'http://127.0.0.1:49318/api/archive/status' -TimeoutSec 1 }
              catch { return }
              Start-Sleep -Seconds 1
            }
            throw 'Loopback service remained after app exit'
          }

          function Wait-Until([scriptblock]$Probe, [string]$Description, [int]$Seconds = 30) {
            $deadline = [DateTime]::UtcNow.AddSeconds($Seconds)
            do {
              $found = & $Probe
              if ($found) { return $found }
              Start-Sleep -Milliseconds 400
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "Timed out: $Description"
          }

          function Find-WindowElement([string]$Name) {
            $condition = New-Object System.Windows.Automation.PropertyCondition(
              [System.Windows.Automation.AutomationElement]::NameProperty, $Name)
            return [System.Windows.Automation.AutomationElement]::RootElement.FindFirst(
              [System.Windows.Automation.TreeScope]::Descendants, $condition)
          }

          function Invoke-Element($element) {
            $element.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern).Invoke()
          }

          function Write-WindowEvidence([string]$Label) {
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $image = New-Object System.Drawing.Bitmap($bounds.Width, $bounds.Height)
            $graphics = [System.Drawing.Graphics]::FromImage($image)
            try {
              $graphics.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)
              $image.Save((Join-Path $directory "$Label.png"))
            } catch { Write-Host "Screenshot unavailable: $_" }
            finally { $graphics.Dispose(); $image.Dispose() }
            $all = [System.Windows.Automation.AutomationElement]::RootElement.FindAll(
              [System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.Condition]::TrueCondition)
            $all | ForEach-Object {
              try {
                $item = $_.Current
                if ($item.Name -or $item.AutomationId) {
                  "$($item.ControlType.ProgrammaticName) | $($item.Name) | $($item.AutomationId)"
                }
              } catch {}
            } | Set-Content -Encoding utf8 (Join-Path $directory "$Label.txt")
          }

          function Install-PrintFixtures {
            $doc = Get-Content -Raw $catalog | ConvertFrom-Json
            $lesson = $doc.catalog.lessons[0]
            $lesson | Add-Member -Force -NotePropertyName materialBasis -NotePropertyValue @{
              scope='lesson'; archivePath='faecher/subject-start/reihen/series-start/stunden/lesson-start/material'
            }
            $doc | ConvertTo-Json -Depth 60 | Set-Content -Encoding UTF8 $catalog
            foreach ($orientation in @('landscape', 'portrait')) {
              $id = "a4-$orientation"
              $folder = Join-Path (Split-Path $catalog) ($lesson.materialBasis.archivePath + '/interaktiv/' + $id)
              New-Item -ItemType Directory -Force $folder | Out-Null
              $title = "A4 $orientation proof"
              $width = if ($orientation -eq 'landscape') { 1123 } else { 794 }
              $height = if ($orientation -eq 'landscape') { 794 } else { 1123 }
              @{
                format='tafelraum-interactive-html'; schemaVersion=1; id=$id; title=$title; entry='index.html'
                defaultViewport=@{width=$width;height=$height}
                print=@{entry='index.html';page='A4';orientation=$orientation;mode='template';layout='shared-pages'}
              } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 (Join-Path $folder 'manifest.json')
              @"
          <!doctype html>
          <html lang="en"><meta charset="utf-8"><title>$title</title>
          <style>
          @page { size:A4 $orientation; margin:12mm; }
          html, body { margin:0; color:#15263d; background:white; font:18px Arial; }
          main { border:1px solid; padding:1em; }
          p { margin-top:2em; }
          </style>
          <main data-tafelraum-page><h1>$title</h1><p>Top, middle and bottom of the printed exercise.</p>
          <table style="width:100%"><tr><td>Start of table</td><td style="text-align:right">End of table</td></tr></table>
          <p>Last line of the exercise.</p></main>
          </html>
          "@ | Set-Content -Encoding UTF8 (Join-Path $folder 'index.html')
            }
            # Windows PowerShell 5 writes a BOM with Set-Content; the application JSON
            # parser expects UTF-8 without a BOM just as the production archive writer does.
            $utf8 = New-Object System.Text.UTF8Encoding($false)
            $files = @($catalog) + @(Get-ChildItem (Join-Path (Split-Path $catalog) $lesson.materialBasis.archivePath) -Recurse -File | ForEach-Object FullName)
            foreach ($file in $files) { [System.IO.File]::WriteAllText($file, [System.IO.File]::ReadAllText($file), $utf8) }
          }

          function Print-Worksheet([string]$Orientation) {
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($newApp.MainWindowHandle)
            $title = "A4 $Orientation proof"
            $place = Wait-Until {
              foreach ($label in @("$title auf die Fl" + [char]0xe4 + 'che', "Place $title on canvas", "Add $title to canvas")) {
                $node = Find-NativeElement $window $label
                if ($node) { return $node }
              }
            } "material row for $title"
            Invoke-Element $place
            $print = Wait-Until {
              $node = Find-NativeElement $window 'Material drucken'
              if (!$node) { $node = Find-NativeElement $window 'Print material' }
              $node
            } 'Material drucken'
            Invoke-Element $print

            $cancel = Wait-Until {
              $node = Find-WindowElement 'Cancel'
              if (!$node) { $node = Find-WindowElement 'Abbrechen' }
              $node
            } 'WebView2 print dialog Cancel button'
            Write-WindowEvidence "$Orientation-preview"

            $destination = Find-WindowElement 'Save as PDF'
            if (!$destination) {
              $combo = Find-WindowElement 'Printer'
              if (!$combo) { $combo = Find-WindowElement 'Destination' }
              if ($combo) {
                $pattern = $null
                if ($combo.TryGetCurrentPattern([System.Windows.Automation.ExpandCollapsePattern]::Pattern, [ref]$pattern)) {
                  $pattern.Expand()
                } else { Invoke-Element $combo }
                $destination = Wait-Until { Find-WindowElement 'Save as PDF' } 'Save as PDF printer'
              }
            }
            if ($destination -and $destination.Current.ControlType -eq [System.Windows.Automation.ControlType]::ListItem) {
              $destination.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
            } elseif ($destination -and $destination.Current.ControlType -eq [System.Windows.Automation.ControlType]::MenuItem) {
              Invoke-Element $destination
            }
            $save = Wait-Until { Find-WindowElement 'Save' } 'Save in WebView2 print preview'
            Invoke-Element $save
            $fileName = Wait-Until {
              $node = Find-WindowElement 'File name:'
              if ($node -and $node.Current.ControlType -eq [System.Windows.Automation.ControlType]::Edit) { $node }
            } 'Save As filename field'
            $out = Join-Path $directory "$Orientation.pdf"
            $fileName.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue($out)
            $saveDialog = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($fileName)
            while ($saveDialog -and $saveDialog.Current.ControlType -ne [System.Windows.Automation.ControlType]::Window) {
              $saveDialog = [System.Windows.Automation.TreeWalker]::ControlViewWalker.GetParent($saveDialog)
            }
            if (!$saveDialog) { throw 'No native Save As window' }
            $saveFile = Find-NativeElement $saveDialog 'Save'
            if (!$saveFile) { throw 'No Save button in native Save As dialog' }
            Invoke-Element $saveFile
            $null = Wait-Until { if (Test-Path $out) { (Get-Item $out).Length -gt 0 } } "$Orientation PDF"
            Write-Host "Exported $Orientation from the native WebView2 print dialog."
          }

          Write-Host 'Installing and opening previous official package'
          Install-App $previous
          $oldApp = Start-App '0.1.93'
          Close-App $oldApp
          $catalog = Join-Path $profile 'unterrichtsarchiv\archive.json'
          Install-PrintFixtures
          $before = (Get-FileHash $catalog).Hash
          Write-Host 'Installing and opening exact 0.1.94 candidate'
          Install-App $candidate.FullName
          $newApp = Start-App '0.1.94'
          try {
            $window = [System.Windows.Automation.AutomationElement]::FromHandle($newApp.MainWindowHandle)
            $materials = Find-NativeElement $window ('Material hinzuf' + [char]0xfc + 'gen')
            if (!$materials) { $materials = Find-NativeElement $window 'Add material' }
            if (!$materials) { throw 'Material drawer action missing' }
            Invoke-Element $materials
            Print-Worksheet 'landscape'
            Print-Worksheet 'portrait'
          } catch {
            Write-WindowEvidence 'print-failure'
            throw
          }
          $room = Invoke-WebRequest 'http://127.0.0.1:49318/room.html' -UseBasicParsing -TimeoutSec 5
          if ($room.StatusCode -ne 200 -or $room.Content -notmatch 'Room Canvas') { throw 'Packaged Room page missing' }
          Close-App $newApp
          if ((Get-FileHash $catalog).Hash -ne $before) { throw 'The archive catalog changed during install or startup' }
          $releasePath = Get-ChildItem (Split-Path $application) -Recurse -Filter 'desktop-release.json' |
            Where-Object { $_.Directory.Name -eq 'server' } | Select-Object -First 1
          $release = Get-Content $releasePath.FullName | ConvertFrom-Json
          if ($release.sourceCommit -ne $sourceCommit) { throw 'Native bundle source mismatch' }
          [ordered]@{version='0.1.94'; sourceCommit=$sourceCommit; priorVersion='0.1.93'; installerSha256=$receipt.installerSha256;
            nativeStartup=$true; regularExit=$true; catalogRetained=$true; roomPage=$true; nativePrintDialog=$true; upgrade='NSIS installer'} |
            ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $directory 'native-acceptance.json')
      - name: Upload native acceptance receipt and print evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: public-windows-native-acceptance
          path: |
            ${{ runner.temp }}/tafelraum-print-qa/native-acceptance.json
            ${{ runner.temp }}/tafelraum-print-qa/*.pdf
            ${{ runner.temp }}/tafelraum-print-qa/*-preview.*
            ${{ runner.temp }}/tafelraum-print-qa/print-failure.*
          if-no-files-found: error
