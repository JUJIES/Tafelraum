name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows source and Room checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: prototypes/surface-shell-a-b/package-lock.json
      - name: Verify public profile
        run: node scripts/check-distribution.mjs public
      - name: Verify shared app versions and release guards
        run: node scripts/check-public-versions.mjs
      - name: Install locked app dependencies
        run: npm ci --prefix prototypes/surface-shell-a-b
      - name: Check source build
        run: npm --prefix prototypes/surface-shell-a-b run build
      - name: Check presentation types
        run: npm --prefix prototypes/surface-shell-a-b run typecheck:live
      - name: Test Room and presentation contracts
        run: npm --prefix prototypes/surface-shell-a-b run test:live
      - name: Test archive and release contracts
        run: node --test scripts/check-public-versions.test.mjs scripts/public-release-set.test.mjs scripts/macos-qa-config.test.mjs scripts/windows-qa-config.test.mjs scripts/windows-installer-qa.test.mjs scripts/windows-server-entry.test.mjs scripts/windows-runtime.test.mjs scripts/desktop-node-runtime.test.mjs scripts/desktop-release-config.test.mjs scripts/agent-kit.test.mjs prototypes/surface-shell-a-b/archive-server.test.mjs
      - name: Install Chromium
        working-directory: prototypes/surface-shell-a-b
        run: npx playwright install chromium
      - name: Test source startup, saving and restart
        run: npm --prefix prototypes/surface-shell-a-b run test:source-browser

  checks:
    name: Tests and browser checks
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CI: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node 24 and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: prototypes/surface-shell-a-b/package-lock.json

      - name: Install locked dependencies
        run: |
          node scripts/check-distribution.mjs
          mkdir -p output/ci
          npm ci --prefix prototypes/surface-shell-a-b 2>&1 | tee output/ci/app-install.log
          if [ -d services/live-canvas ]; then npm ci --prefix services/live-canvas 2>&1 | tee output/ci/live-install.log; fi

      - name: Check types, unit tests and presentation builds
        run: |
          npm --prefix prototypes/surface-shell-a-b run typecheck 2>&1 | tee output/ci/app-types.log
          npm --prefix prototypes/surface-shell-a-b run typecheck:live 2>&1 | tee output/ci/live-types.log
          npm --prefix prototypes/surface-shell-a-b test 2>&1 | tee output/ci/app-tests.log
          npm --prefix prototypes/surface-shell-a-b run test:live 2>&1 | tee output/ci/live-tests.log
          if [ -d services/live-canvas ]; then npm --prefix prototypes/surface-shell-a-b run build:live 2>&1 | tee output/ci/viewer-build.log; fi

      - name: Audit dependencies for high and critical findings
        run: |
          npm --prefix prototypes/surface-shell-a-b audit --audit-level=high 2>&1 | tee output/ci/app-audit.log
          if [ -d services/live-canvas ]; then npm --prefix services/live-canvas audit --audit-level=high 2>&1 | tee output/ci/service-audit.log; fi

      - name: Test local services
        run: |
          if [ -d services/live-canvas ]; then npm --prefix services/live-canvas run typecheck 2>&1 | tee output/ci/service-types.log; fi
          if [ -d services/live-canvas ]; then npm --prefix services/live-canvas test 2>&1 | tee output/ci/service-tests.log; fi
          npm --prefix services/mobile-capture test 2>&1 | tee output/ci/relay-tests.log

      - name: Install Chromium and WebKit
        run: npm --prefix prototypes/surface-shell-a-b run test:browser:install 2>&1 | tee output/ci/browser-install.log

      - name: Run browser checks with synthetic data
        run: npm --prefix prototypes/surface-shell-a-b run test:browser 2>&1 | tee output/ci/browser-tests.log

      - name: Test optimised source startup and restart
        run: npm --prefix prototypes/surface-shell-a-b run test:source-browser 2>&1 | tee output/ci/source-start-tests.log

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            output/ci/*.log
            output/ui-language-browser/*.json
            output/ui-language-browser/*.png
            output/app-hardening-regression/*.json
            output/app-hardening-regression/*.png
            output/storage-material-regression/*.json
            output/storage-material-regression/*.png
            output/agent-onboarding/*.json
            output/agent-onboarding/*.png
            output/developer-onboarding/*.json
            output/developer-onboarding/*.png
            output/developer-onboarding/*.log
            output/source-browser-start/*.json
            output/source-browser-start/*.png
            output/source-browser-start/*.log
