<body>
  <main>
    <header><span id="title">Aufnahme senden</span><span id="connection" role="status">Verbinden …</span></header>
    <section id="capture" hidden aria-label="Aufnahmen">
      <div class="choices">
        <button id="camera" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/></svg><span>Foto aufnehmen</span></button>
        <button id="choose" type="button" class="secondary"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg><span>Datei auswählen</span></button>
      </div>
      <input id="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple hidden>
      <ul id="items" aria-label="Ausgewählte Aufnahmen"></ul>
      <p id="feedback" role="status" aria-live="polite" hidden></p>
      <footer id="actions" hidden><button id="send" type="button">Senden</button></footer>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
  <dialog id="camera-view" aria-label="Foto aufnehmen">
    <div class="camera-top"><span id="camera-note" role="status" aria-live="polite">Kamera wird geöffnet …</span><button id="camera-close" type="button" class="secondary">Fertig</button></div>
    <div class="camera-stage"><video id="camera-video" autoplay muted playsinline></video></div>
    <button id="camera-shoot" type="button" disabled>Auslösen</button>
  </dialog>
  <dialog id="viewer" aria-labelledby="viewer-name">
    <div class="viewer-header"><span id="viewer-name"></span><button id="viewer-close" type="button" aria-label="Vorschau schließen">×</button></div>
    <div class="viewer-stage" id="viewer-stage"><img id="viewer-image" alt=""></div>
    <button id="viewer-zoom" type="button" class="secondary">Vergrößern</button>
  </dialog>
</body>
</html>
