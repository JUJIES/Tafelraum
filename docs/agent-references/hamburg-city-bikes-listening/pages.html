<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A seaside bike tour</title>
  <link rel="stylesheet" href="pages.css">
<link rel="stylesheet" href="page-footer.css"></head>
<body>
<main class="sheet" data-tafelraum-page="1"><div class="ab-page-body">
  <header class="heading">
    <div class="heading-copy">
      <p class="eyebrow">ENGLISH · MEANS OF TRANSPORT · LISTENING</p>
      <h1>A seaside bike tour</h1>
      <p class="subhead">A fictional group outing · Template; no audio included.</p>
    </div>
    <svg class="bike-mark" viewBox="0 0 144 108" role="img" aria-label="Illustration of a city bicycle">
      <circle cx="33" cy="76" r="22" fill="none" stroke="currentColor" stroke-width="5"/>
      <circle cx="110" cy="76" r="22" fill="none" stroke="currentColor" stroke-width="5"/>
      <path d="M33 76 58 43 76 76H33M58 43h28l24 33M76 76 94 42M86 42h22M55 43l-4-9h-9" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="5"/>
      <circle cx="76" cy="76" r="5" fill="#ca684a"/>
    </svg>
  </header>

  <section class="assignment" aria-labelledby="task-heading">
    <span class="assignment-number">1</span>
    <div>
      <h2 id="task-heading">Listen and find out</h2>
      <p>Read the questions. Listen to the group-tour briefing and note the key details. Listen again to check.</p>
    </div>
  </section>

  <div class="questions">
    <div class="question">
      <label for="q1-independent"><span class="q-number">01</span><span>At what time does the bike tour begin?</span></label>
      <textarea id="q1-independent" rows="1"></textarea>
    </div>
    <div class="question">
      <label for="q2-independent"><span class="q-number">02</span><span>Where does the group meet?</span></label>
      <textarea id="q2-independent" rows="1"></textarea>
    </div>
    <div class="question double">
      <label><span class="q-number">03</span><span>What should participants bring? Name <strong>two things</strong>.</span></label>
      <div class="two-answers"><textarea id="q3a-independent" rows="1" aria-label="First item"></textarea><textarea id="q3b-independent" rows="1" aria-label="Second item"></textarea></div>
    </div>
    <div class="question double">
      <label><span class="q-number">04</span><span>Which places will the group visit? Name <strong>two stops</strong>.</span></label>
      <div class="two-answers"><textarea id="q4a-independent" rows="1" aria-label="First stop"></textarea><textarea id="q4b-independent" rows="1" aria-label="Second stop"></textarea></div>
    </div>
    <div class="question">
      <label for="q5-independent"><span class="q-number">05</span><span>What should a rider do if a bike has a problem?</span></label>
      <textarea id="q5-independent" rows="1"></textarea>
    </div>
    <div class="question">
      <label for="q6-independent"><span class="q-number">06</span><span>Which part of the route must the group walk along?</span></label>
      <textarea id="q6-independent" rows="1"></textarea>
    </div>
    <div class="question">
      <label for="q7-independent"><span class="q-number">07</span><span>What is the alternative plan if there is heavy rain?</span></label>
      <textarea id="q7-independent" rows="1"></textarea>
    </div>
  </div>

  
</div><div class="ab-page-spacer" aria-hidden="true"></div><div class="ab-page-footer" data-ab-page-footer><div class="ab-footer-row"><span class="ab-footer-note">Own task example · No audio included.</span><span class="ab-footer-folio">1 / 1</span></div></div></main>
</body>
</html>
